name: Connect daily logs links and replace images

on:
  repository_dispatch:
    types: [notion_trigger]
  workflow_dispatch: # Allows manual trigger from the GitHub UI anytime 

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
       - name: Check out repository
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
              python-version: '3.10'
              cache: 'pip'

       - name: Install dependencies
         run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
       - name: Execute Script
         env:
              NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
              DAILY_NOTES_DB_ID : ${{ secrets.DAILY_NOTES_DATABASE_ID}} 
              STOCK_DB_ID : ${{ secrets.STOCK_DATABASE_ID }}
         run: python auto_connect_link.py