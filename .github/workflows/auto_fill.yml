name: Auto-fill Stock Info

on:
  schedule:
    # Runs every 60 minutes (UTC)
    - cron: '*/60 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI anytime
  repository_dispatch:
    types: [notion_trigger]

jobs:
  fill-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python auto_fill_stocks.py